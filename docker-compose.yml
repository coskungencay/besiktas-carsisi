services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Temayi imaja sabitlemek isterseniz doldurun (bos = panelden secilebilir)
        NEXT_PUBLIC_THEME: "${NEXT_PUBLIC_THEME:-}"
    image: cafe-infra:latest
    container_name: cafe-infra
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /data/app.db
      UPLOADS_DIR: /data/uploads
    ports:
      # Coolify/Traefik arkasinda calisirken bu satiri kaldirin;
      # reverse proxy dogrudan container agina baglanir.
      - "3000:3000"
    volumes:
      - cafe_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cafe_data:
    name: cafe_data
